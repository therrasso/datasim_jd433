[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "therrasso-datasim_jd433"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告数据合成与仿真工程师·批处理调度与吞吐折中相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "therrasso" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://therrasso.github.io"
Repository = "https://github.com/therrasso/datasim_jd433"
Issues = "https://github.com/therrasso/datasim_jd433/issues"

[project.scripts]
datasim_jd433 = "datasim_jd433:main"

[tool.setuptools]
py-modules = ["datasim_jd433"]
